name: service-a
steps:
  lint:
    run: bash scripts/lint.sh {files}
    fix: bash scripts/fix.sh {files}
    files: "src/**/*.txt"
  tidy:
    run: bash scripts/tidy.sh {files}
    files: "src/**/*.txt"
pipelines:
  ci:
    steps: [lint]
  pre-commit:
    steps: [lint]
  agent-edit:
    steps: [lint]
git:
  hooks:
    pre-commit:
      pipeline: pre-commit
agents:
  claude-code:
    hooks:
      PostToolUse:
        - matcher: Edit|Write
          pipeline: agent-edit
