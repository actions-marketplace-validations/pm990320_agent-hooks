name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # pull_request_target runs the workflow from the BASE branch and
  # doesn't require approval — GitHub trusts it because it uses
  # main's workflow file, not the PR head's. We scope it to the
  # release-please branch so bot-authored release PRs get CI
  # without the "action_required" gate that blocks regular
  # pull_request events from github-actions[bot].
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skip pull_request_target for human PRs — pull_request already
    # covers those. Only pull_request_target from bots (github-actions[bot])
    # should proceed, avoiding duplicate runs.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so agent-hooks' change-gates can resolve
          # origin/main for `since: merge-base` comparisons, and
          # `since: head` can reach changed() without throwing. The
          # default fetch-depth: 1 gives a detached HEAD with no base
          # ref, which crashed the pipeline runner pre-ah-8cq.
          fetch-depth: 0
          # pull_request_target defaults to checking out the BASE
          # branch. Override to the PR head so we actually test the
          # PR's code. Safe here because we gate pull_request_target
          # to github-actions[bot] only (release-please).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.x --compile stopped emitting linker-signed
          # darwin-arm64 output, so downloaded releases get SIGKILL'd by
          # macOS Sonoma+ provenance enforcement. 1.2.15 still signs.
          bun-version: "1.2.15"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run agent-hooks CI (dogfood)
        run: bun src/index.ts ci --all

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  binary-matrix:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            artifact: agent-hooks-linux-x64
            can-run: true
          - target: bun-linux-arm64
            runner: ubuntu-latest
            artifact: agent-hooks-linux-arm64
            can-run: false
          - target: bun-darwin-x64
            runner: macos-latest
            artifact: agent-hooks-darwin-x64
            can-run: false
          - target: bun-darwin-arm64
            runner: macos-latest
            artifact: agent-hooks-darwin-arm64
            can-run: true
          - target: bun-windows-x64
            runner: windows-latest
            artifact: agent-hooks-windows-x64.exe
            can-run: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.x --compile stopped emitting linker-signed
          # darwin-arm64 output, so downloaded releases get SIGKILL'd by
          # macOS Sonoma+ provenance enforcement. 1.2.15 still signs.
          bun-version: "1.2.15"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile binary
        shell: bash
        run: |
          mkdir -p bin
          bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile ./bin/${{ matrix.artifact }}

      # Belt-and-suspenders against bun linker-signing regressions.
      # See release-please.yml's matching step for rationale.
      - name: Re-sign darwin binary (ad-hoc)
        if: startsWith(matrix.target, 'bun-darwin')
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/${{ matrix.artifact }}
          codesign --remove-signature "$BIN" || true
          codesign -fs - --force --deep "$BIN"
          codesign -dvv "$BIN" 2>&1 | grep -E "flags|Signature" || true

      - name: Smoke-test native binary
        if: matrix.can-run
        shell: bash
        run: |
          ./bin/${{ matrix.artifact }} --version
          ./bin/${{ matrix.artifact }} --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  # Node-runtime integration test. The npm package ships compiled JS
  # (bun build --target=node), not a native binary. This job verifies
  # the JS bundle runs end-to-end under a real Node runtime: pack, install
  # into a consumer dir, invoke --version / --help / list via the symlink.
  npm-node-smoke:
    name: npm smoke test (Node)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile

      - name: Build Node-compatible JS bundle
        run: bun run build:npm

      - name: Pack
        run: |
          set -euo pipefail
          npm pack
          mv pm990320-agent-hooks-*.tgz /tmp/agent-hooks.tgz
          echo "=== tarball contents ==="
          tar tzf /tmp/agent-hooks.tgz | sort

      - name: Install in clean consumer dir under Node runtime
        run: |
          set -euo pipefail
          mkdir /tmp/consumer
          cd /tmp/consumer
          printf '{"name":"consumer","version":"1.0.0","private":true}\n' > package.json
          npm install /tmp/agent-hooks.tgz

      - name: --version under Node
        run: |
          set -euo pipefail
          cd /tmp/consumer
          version=$(./node_modules/.bin/agent-hooks --version)
          expected=$(jq -r .version "$GITHUB_WORKSPACE/package.json")
          echo "got: $version, expected: $expected"
          [ "$version" = "$expected" ]

      - name: --help under Node
        run: /tmp/consumer/node_modules/.bin/agent-hooks --help | head -10

      - name: schema subcommand under Node
        run: /tmp/consumer/node_modules/.bin/agent-hooks schema | head -5
