name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote preview draft to ${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # The real draft release was just created by release-please (draft: true
          # in release-please-config.json). Copy every asset from the `preview`
          # draft into it — binaries AND the version-pinned install.sh — then
          # publish. If the preview is missing, fail: we don't silently rebuild.

          if ! gh release view preview >/dev/null 2>&1; then
            echo "::error::No 'preview' draft release found. Did release-draft.yml run on the release PR?"
            exit 1
          fi

          mkdir -p /tmp/preview-bins
          gh release download preview --dir /tmp/preview-bins
          gh release upload "$TAG" /tmp/preview-bins/* --clobber
          gh release delete preview --yes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest
