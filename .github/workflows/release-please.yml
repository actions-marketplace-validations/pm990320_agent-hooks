name: release-please

on:
  push:
    branches:
      - main
  # Manual re-trigger, e.g. if the preview build needs re-running
  # against the current release-please PR head.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # release-please-action v4 in manifest mode (config-file +
    # manifest-file) emits PATH-PREFIXED per-package outputs like
    # `.--release_created` and `.--tag_name`, not the unsuffixed
    # `release_created` / `tag_name` that the v3 docs describe. The
    # aggregate boolean `releases_created` is still emitted for any-
    # package-released. Reading the wrong names silently returns
    # empty strings, which is what caused v0.1.0 and v0.2.0 to ship
    # with `promote-release` skipped (release_created != 'true'
    # evaluated true for an empty string, firing build-preview
    # instead). Use the aggregate for the boolean and the path-
    # prefixed name for the tag.
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] }}
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the 5 platform binaries from the release-please PR head (which
  # already has the bumped package.json version). Runs in the SAME
  # workflow as release-please itself, because the GITHUB_TOKEN
  # recursion guard means a separate `pull_request`-triggered workflow
  # would never fire for release-please's own PR.
  build-preview:
    needs: release-please
    if: >-
      needs.release-please.outputs.pr != '' &&
      needs.release-please.outputs.pr != 'null' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        # IMPORTANT: darwin targets MUST build on macos-* runners. Bun's
        # --compile output is signed ad-hoc by the host linker only when
        # the build host is macOS. Cross-compiling darwin from linux
        # produces an unsigned Mach-O, and macOS Sonoma+ kills unsigned
        # downloaded binaries on exec via com.apple.provenance (even
        # without the classic com.apple.quarantine attribute). Matrix
        # mirrors .github/workflows/ci.yml's binary-matrix for
        # consistency.
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            artifact: agent-hooks-linux-x64
            can-run: true
          - target: bun-linux-arm64
            runner: ubuntu-latest
            artifact: agent-hooks-linux-arm64
            can-run: false
          - target: bun-darwin-x64
            runner: macos-latest
            artifact: agent-hooks-darwin-x64
            can-run: false
          - target: bun-darwin-arm64
            runner: macos-latest
            artifact: agent-hooks-darwin-arm64
            can-run: true
          - target: bun-windows-x64
            runner: windows-latest
            artifact: agent-hooks-windows-x64.exe
            can-run: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.x --compile stopped emitting linker-signed
          # darwin-arm64 output, so downloaded releases get SIGKILL'd by
          # macOS Sonoma+ provenance enforcement. 1.2.15 still signs.
          bun-version: "1.2.15"

      - run: bun install --frozen-lockfile
        shell: bash

      - name: Compile ${{ matrix.artifact }}
        shell: bash
        run: |
          mkdir -p bin
          bun build ./src/index.ts --compile --target=${{ matrix.target }} \
            --outfile ./bin/${{ matrix.artifact }}

      # Belt-and-suspenders against bun linker-signing regressions.
      # `codesign -fs -` alone fails on bun's --compile output with
      # "invalid or unsupported format for signature", but the
      # remove-then-sign sequence succeeds. This guarantees every
      # darwin asset carries at least an ad-hoc signature before
      # leaving CI, regardless of what bun's --compile pipeline
      # emitted. Idempotent: linker-signed output is re-signed to
      # plain ad-hoc and still runs.
      - name: Re-sign darwin binary (ad-hoc)
        if: startsWith(matrix.target, 'bun-darwin')
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/${{ matrix.artifact }}
          codesign --remove-signature "$BIN" || true
          codesign -fs - --force --deep "$BIN"
          codesign -dvv "$BIN" 2>&1 | grep -E "flags|Signature" || true

      - name: Smoke-test native binary
        if: matrix.can-run
        shell: bash
        run: |
          ./bin/${{ matrix.artifact }} --version
          ./bin/${{ matrix.artifact }} --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error

  publish-preview:
    needs: [release-please, build-preview]
    if: >-
      needs.release-please.outputs.pr != '' &&
      needs.release-please.outputs.pr != 'null' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}

      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Read upcoming version from PR manifest
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin install.sh to upcoming release tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s|^VERSION=\"latest\"|VERSION=\"$TAG\"|" scripts/install.sh
          grep '^VERSION=' scripts/install.sh

      - name: Upsert preview draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ fromJson(needs.release-please.outputs.pr).number }}
          PR_HTML_URL: https://github.com/${{ github.repository }}/pull/${{ fromJson(needs.release-please.outputs.pr).number }}
        run: |
          set -euo pipefail

          NOTES=$(cat <<EOF
          Preview build for upcoming **v${VERSION}** (from #${PR_NUMBER}).

          These binaries and the pinned install.sh were compiled from the
          release-please PR head and will be promoted to the real release
          when the PR merges. Do not link to this draft — it's ephemeral
          and gets overwritten on every PR update.

          See: ${PR_HTML_URL}
          EOF
          )

          # Replace the existing preview wholesale so stale assets never linger.
          if gh release view preview >/dev/null 2>&1; then
            gh release delete preview --yes
          fi

          gh release create preview \
            --draft \
            --title "Preview build (v${VERSION})" \
            --notes "$NOTES" \
            ./bin/* scripts/install.sh

  promote-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote preview draft to ${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # The real draft release was just created by release-please (draft: true
          # in release-please-config.json). Copy every asset from the `preview`
          # draft into it — binaries AND the version-pinned install.sh — then
          # publish. If the preview is missing, fail: we don't silently rebuild.

          if ! gh release view preview >/dev/null 2>&1; then
            echo "::error::No 'preview' draft release found. Did build-preview/publish-preview run on the release PR?"
            exit 1
          fi

          mkdir -p /tmp/preview-bins
          gh release download preview --dir /tmp/preview-bins
          gh release upload "$TAG" /tmp/preview-bins/* --clobber
          gh release delete preview --yes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Advance rolling major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Composite-action consumers pin to a rolling major tag
          # (pm990320/agent-hooks@v0, @v1, etc.) so they get patches
          # without touching their workflow. Move that tag forward on
          # every release — e.g. v0.1.5 also updates v0.
          MAJOR_TAG="${TAG%%.*}"   # v0.1.5 → v0
          if [ "$MAJOR_TAG" = "$TAG" ]; then
            echo "::warning::tag '$TAG' does not look like vMAJOR.MINOR.PATCH — skipping rolling-tag update"
            exit 0
          fi

          SHA=$(gh api "repos/$REPO/git/refs/tags/$TAG" --jq .object.sha)
          echo "Rolling $MAJOR_TAG → $SHA (from $TAG)"

          # Check exact-match existence of refs/tags/$MAJOR_TAG via
          # the matching-refs endpoint. Do NOT use GET /git/refs/tags/$MAJOR_TAG
          # for this check — that endpoint does PREFIX matching, so
          # querying "v0" will match "v0.1.0" and lie that v0 exists,
          # which then makes PATCH /git/refs/tags/v0 fail with 422
          # "Reference does not exist".
          exists=$(gh api "repos/$REPO/git/matching-refs/tags/$MAJOR_TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$MAJOR_TAG\")] | length")
          if [ "$exists" -gt 0 ]; then
            echo "Updating existing refs/tags/$MAJOR_TAG"
            gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR_TAG" \
              -f sha="$SHA" -F force=true
          else
            echo "Creating new refs/tags/$MAJOR_TAG"
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$MAJOR_TAG" -f sha="$SHA"
          fi

  # Publish the thin npm wrapper package. Runs AFTER promote-release so
  # the GitHub release's binary assets are already live — the wrapper's
  # postinstall downloads from `/releases/download/v<version>/...` at
  # consumer install time, so publishing the npm package before the
  # release would result in postinstall 404s until the release shipped.
  publish-npm:
    needs: [release-please, promote-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # `id-token: write` enables npm provenance (--provenance flag) so
    # published packages carry a verifiable link back to this workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
