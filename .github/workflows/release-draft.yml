name: release-draft

# Build binaries from the release-please PR head (which already contains the
# bumped package.json version) and stash them on a floating `preview` draft
# release. When the PR is merged, `release-please.yml` promotes those binaries
# onto the real release instead of rebuilding.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-linux-x64
            artifact: agent-hooks-linux-x64
          - target: bun-linux-arm64
            artifact: agent-hooks-linux-arm64
          - target: bun-darwin-x64
            artifact: agent-hooks-darwin-x64
          - target: bun-darwin-arm64
            artifact: agent-hooks-darwin-arm64
          - target: bun-windows-x64
            artifact: agent-hooks-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.artifact }}
        run: |
          mkdir -p bin
          bun build ./src/index.ts --compile --target=${{ matrix.target }} \
            --outfile ./bin/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error

  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Read upcoming version from PR manifest
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upsert preview draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          NOTES=$(cat <<EOF
          Preview build for upcoming **v${VERSION}** (from #${PR_NUMBER}).

          These binaries were compiled from the release-please PR head and will
          be promoted to the real release when the PR merges. Do not link to
          this draft — it's ephemeral and gets overwritten on every PR update.

          See: ${PR_HTML_URL}
          EOF
          )

          # Replace the existing preview wholesale so stale assets never linger.
          if gh release view preview >/dev/null 2>&1; then
            gh release delete preview --yes
          fi

          gh release create preview \
            --draft \
            --title "Preview build (v${VERSION})" \
            --notes "$NOTES" \
            ./bin/*
